<app-header></app-header>
<app-sidebar></app-sidebar>
<!-- Button trigger modal -->
<main>
<button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal" style="margin-left: 998px;">
  ADD+
</button>

<!-- Modal -->
<div class="modal fade" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Tagging</h5>
        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <form>

          <div class="form-group">
              <label for="tag">TOURNAMENT NAME</label>
              <select [(ngModel)]="tag" name="tag" class="form-control" (click)="gamestournamentgets()">
                <option value="1" selected>---user type---</option>
                <option [value]="item.id" *ngFor="let item of itema" >
                       {{item.game_name}}
                </option>
                </select>
          </div>

          <!-- <div class="form-group">
            <label for="game">GAME NAME</label>
            <select [(ngModel)]="game" name="game" class="form-control" (click)="gamestournamentget()">
              <option value="1" selected>---user type---</option>
              <option [value]="item.id" *ngFor="let item of items" >
                     {{item.game_name}}
              </option>
              </select>
        </div> -->
        </form>



      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Save</button>
      </div>
    </div>
  </div>
</div>

<table class="table set">
  <thead>
    <tr>
      <th scope="col">Id</th>
      <th scope="col">TOURNAMENT NAME</th>
      <th scope="col">USER DETAILS</th>
      </tr>
</thead>
</table>
</main>
<app-footer></app-footer>
