<main class="bgImg">
    <div class="container">
        <section class="section register min-vh-100 d-flex flex-column align-items-center justify-content-center py-4">

            <!-- <div class="background">
 
               <img src="assets/img/background.png">
               <div class="transbox"></div>
                -->

            <div class="container ">
                <div class="row justify-content-center">
                    <div class="col-lg-4 col-md-6 d-flex flex-column align-items-center justify-content-center  ">

                        <div class="card mb-3 ">
                            <div class=" backgroundsign">
                                <div class="pt-4 pb-2 ">
                                    <h4 class="loginclo text-center  ">SIGN UP</h4>
                                    <!-- <p class="text-center small">Enter your username & password to login</p> -->
                                </div>
                                <form class="row g-5 needs-validation" novalidate>
                                    <div class="col-12 d-flex justify-content-center formfield">

                                        <div class="input-group has-validation d-flex justify-content-center">
                                            <input type="text" name="username" class="form-control usernameclo"
                                                id="yourUsername" placeholder="USERNAME" style="font-size: 12px;" [(ngModel)]="username"
                                               (keypress)="valid.onlyCharAndSpace($event)" required>

                                        </div>

                                        <div class="input-group has-validation d-flex justify-content-center">
                                            <input type="text" name="number" class="form-control usernameclo"
                                                id="phonenumber" placeholder="PHONE NUMBER" style="font-size: 12px;"[(ngModel)]="number"
                                               (keypress)= "valid.isNumberKey($event)"

                                                required>

                                        </div>


                                        <div class="input-group has-validation d-flex justify-content-center">
                                            <input type="text" name="age" class="form-control usernameclo" id="age"[(ngModel)]="age"
                                                placeholder="AGE" style="font-size: 12px;" required>

                                        </div>

                                        <div class="input-group has-validation d-flex justify-content-center">
                                            <input type="text" name="email" class="form-control usernameclo" id="email"[(ngModel)]="email"
                                                placeholder="EMAIL" style="font-size: 12px;" required>

                                        </div>

                                        <!-- <div class="col-12 d-flex justify-content-center ">
                                            <div class="input-group has-validation d-flex justify-content-center">
                                                <input type="password" name="password" class="form-control passwordclo "
                                                    id="yourPassword" placeholder="PASSWORD" style="font-size: 12px;"
                                                    required>

                                                <i class='bx bxs-low-vision hideeye'></i>
                                            </div>
                                        </div> -->

                                        <div class="col-12 d-flex justify-content-center ">
                                            <div class="input-group has-validation d-flex justify-content-center">
              
                                             <input [type]="showPassword ?'text':'password'"  name="password" class="form-control passwordclo " style="color: #EFF2F4;" 
                                             id="yourPassword" placeholder="Password" [(ngModel)]="password" required >
                                             <div>
                                          <i (click)="taggleshow()" class="bx bx-show hideey" *ngIf="showPassword"></i>
                                       <i (click)="taggleshow()" class='bx bx-hide hideeye' *ngIf="!showPassword"></i> 
                                   </div>
                                      </div>
                                         </div>

                                        <div class="input-group has-validation d-flex justify-content-center">
                                            <input type="text" name="confirmpassword" class="form-control usernameclo"
                                                id="confirmpassword" placeholder="CONFIRM PASSWORD" [(ngModel)]="c_password"
                                                style="font-size: 12px;" required>
                                        </div>

                                    </div>



                                    <div class=" d-flex justify-content-center"> <button class="btnSubmit"
                                            type="submit" (click)="signin()">SIGN UP</button></div>
                                    
                                        <p style="font-size: 12px;text-align: center;color: #EFF2F4;cursor:pointer ; gap:10px;"
                                            (click)="backtologin()">Already Have An Account ? <u>Sign In</u></p>

                                    <div>

                                    </div>

                                </form>

                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <p class="copyright-text d-flex justify-content-center"  style="color: white; margin: 20px;">Copyright &copy; 2024 All Rights Reserved by
                <a href="https://www.bisso.com/">Bisso</a>
            </p>
        </section>
    </div>
</main>
